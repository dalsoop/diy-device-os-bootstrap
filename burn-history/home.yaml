apiVersion: homelab.gujo.dev/v1alpha1
kind: World

metadata:
  name: Gujo Home
  slug: gujo-home
  lifecycle: draft

spec:
  defaultMedia: dns-install

  assets:
    - id: router-main
      type: router
      managementAddress: 10.0.0.1
      assurance: planned-unverified
    - id: switch-main
      type: ethernet-switch
      assurance: planned-unverified
    - id: hp-dns-01
      type: computer
      inventoryRef: os-installs/dns01/hardware.conf
    - id: hp-dns-02
      type: computer
      inventoryRef: os-installs/dns02/hardware.conf
    - id: hp-dns-03
      type: computer
      inventoryRef: os-installs/dns03/hardware.conf

  networks:
    - id: home-lan
      cidr: 10.0.0.0/16
      gateway: 10.0.0.1
      assurance: planned-unverified

  nodes:
    - id: dns01
      assetRef: hp-dns-01
      role: dns-appliance
      networkRef: home-lan
      ipv4: 10.0.5.1
    - id: dns02
      assetRef: hp-dns-02
      role: dns-appliance
      networkRef: home-lan
      ipv4: 10.0.5.2
    - id: dns03
      assetRef: hp-dns-03
      role: dns-appliance
      networkRef: home-lan
      ipv4: 10.0.5.3

  services:
    - id: dns-cluster
      type: authoritative-and-recursive-dns
      members:
        - dns01
        - dns02
        - dns03

  media:
    - id: dns-install
      entries:
        - dns-appliance
      language: ko-KR
    - id: inventory-capture
      entries:
        - debian-live
      language: ko-KR

  policies:
    unattendedInstall: guarded
    requireExactHardwareMatch: true
    requireSingleInternalTargetDisk: true
    requireTargetSpecificEraseConfirmation: true
    automaticBootTimeout: disabled
