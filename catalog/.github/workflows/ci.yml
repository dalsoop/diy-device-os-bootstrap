name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Check shell syntax
        run: find bin tests -type f -perm -u+x -print0 | xargs -0 -n1 sh -n
      - name: ShellCheck
        run: find bin tests -type f -perm -u+x -print0 | xargs -0 shellcheck
      - name: Verify catalog
        run: tests/catalog-contract.sh
