profiles="dns"
auto_profiles="dns"

debian_mirror="https://snapshot.debian.org/archive/debian/20261011T000000Z/"
security_mirror="https://snapshot.debian.org/archive/debian-security/20261011T000000Z/"
updates_mirror="https://snapshot.debian.org/archive/debian/20261011T000000Z/"
mirror_components="main non-free-firmware"

export ARCH="amd64"
export CODENAME="trixie"
export DEBVERSION="13.7"
export MAXCDS="1"
export INSTALLER_CD="2"
export DOJIGDO="0"
export DISKINFO="Gujo Homelab OS Installer - DNS Appliance - Debian 13 amd64"
export KERNEL_PARAMS="auto=true priority=critical preseed/file=/cdrom/simple-cdd/default.preseed"

# Zero disables unattended boot. The operator must deliberately start install.
BOOT_TIMEOUT="0"
use_serial_console="false"
