#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr @@LAN_CIDR@@ udp dport 53 accept
        ip saddr @@LAN_CIDR@@ tcp dport 53 accept
        ip saddr { 10.0.5.1, 10.0.5.2, 10.0.5.3 } tcp dport 53443 accept
        ip saddr @@MANAGEMENT_CIDR@@ tcp dport { 22, 9090, 9100, 53443 } accept

        iifname "tailscale0" udp dport 53 accept
        iifname "tailscale0" tcp dport { 22, 53, 9090, 9100, 53443 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
