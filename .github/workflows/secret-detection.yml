# Secret detection (gitleaks). Fails when a commit of this pull request, or a commit pushed to the default branch,
# contains something that looks like a secret. Values are redacted: the log shows rule, file, line, commit and the
# gitleaks fingerprint only. Same rules as the gujoai GitLab pipelines (gitlab.com/gujoai/infra/ci-templates,
# decision 0002); added 2026-11-10 with the owner's approval (keep secrets out of all our repositories).
#
# A test fixture that looks like a secret: put its fingerprint into .gitleaksignore at the repository root with a
# "# reason" comment line directly above it, or add an allowlist with a description to .gitleaks.toml
# ([extend] useDefault = true). Inline `gitleaks:allow` comments are not honoured. A real secret: rotate it and drop
# the commit from the branch (history of the default branch is not rewritten; rotation is the fix).
#
# Pinned: actions/checkout by commit, the gitleaks image by digest (v8.30.1, the same version as the Macs and GitLab CI).
name: secret-detection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks on the new commits (values redacted)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="-1 $SHA"
          fi
          echo "scanning commits: $range"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --no-color --redact --ignore-gitleaks-allow --verbose --log-opts="$range" /repo
