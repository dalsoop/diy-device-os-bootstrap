name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ruby shellcheck
      - name: Check shell syntax
        run: |
          find device-os installer catalog -type f -perm -u+x -print0 |
            xargs -0 -n1 bash -n
      - name: ShellCheck
        run: |
          find device-os installer catalog -type f -perm -u+x -print0 |
            xargs -0 shellcheck
      - name: Check Python syntax
        run: |
          python3 -c 'compile(open("installer/management/dns-appliance-status-monitor/server.py", encoding="utf-8").read(), "server.py", "exec")'
      - name: Validate World contract
        run: |
          ruby -ryaml -ripaddr -e '
            root = YAML.safe_load_file("world/world-playbook.yaml", permitted_classes: [], aliases: false)
            world = YAML.safe_load_file("world/drafts/gujo-home/world.yaml", permitted_classes: [], aliases: false)
            abort("invalid WorldPlaybook") unless root["apiVersion"] == "homelab.gujo.dev/v1alpha1" && root["kind"] == "WorldPlaybook"
            abort("invalid World") unless world["apiVersion"] == "homelab.gujo.dev/v1alpha1" && world["kind"] == "World"
            spec = world.fetch("spec")
            ids = spec.fetch("nodes").map { |node| node.fetch("id") }
            abort("duplicate node ID") unless ids.uniq.length == ids.length
            addresses = spec.fetch("nodes").map { |node| IPAddr.new(node.fetch("ipv4")) }
            abort("duplicate node address") unless addresses.uniq.length == addresses.length
            network = IPAddr.new(spec.fetch("networks").first.fetch("cidr"))
            abort("node outside network") unless addresses.all? { |address| network.include?(address) }
          '
      - name: Validate Catalog contracts
        run: |
          catalog/bin/verify-catalog
          catalog/tests/catalog-contract.sh
      - name: Resolve embedded Catalog
        working-directory: installer
        run: usb-media/resolve-catalog
      - name: Run Installer simulations
        working-directory: installer
        run: |
          tests/install-gate-simulation.sh
          tests/management-simulation.sh
          tests/tailscale-enrollment-simulation.sh
          tests/media-catalog-simulation.sh
          tests/macos-writer-simulation.sh
          tests/repository-contract.sh
