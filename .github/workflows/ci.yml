name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ruby shellcheck
      - name: Check project license notices
        shell: bash
        run: |
          test -r LICENSE
          test -r LICENSE_HISTORY.md
          test -r THIRD_PARTY_NOTICES.md
          test -r third_party/licenses/Tailscale-BSD-3-Clause.txt
          missing=0
          while IFS= read -r file; do
            if ! grep -q '^# SPDX-FileCopyrightText: 2026 dalsoop$' "$file"; then
              echo "missing SPDX copyright header: $file" >&2
              missing=1
            fi
            if ! grep -q '^# SPDX-License-Identifier: GPL-3.0-only$' "$file"; then
              echo "missing SPDX license header: $file" >&2
              missing=1
            fi
          done < <(git ls-files --stage | awk '$1 == "100755" { print $4 }')
          test "$missing" -eq 0
      - name: Install pinned Agent Gateway dependencies
        run: |
          python3 -m venv /tmp/device-os-agent-ci
          /tmp/device-os-agent-ci/bin/python -m pip install \
            --requirement agent/requirements.lock
      - name: Check shell syntax
        run: |
          bash -n agent/run
          find device-os installer catalog -type f -perm -u+x -print0 |
            xargs -0 -n1 bash -n
      - name: ShellCheck
        run: |
          shellcheck agent/run
          find device-os installer catalog -type f -perm -u+x -print0 |
            xargs -0 shellcheck
      - name: Check Python syntax
        run: |
          python3 -c 'compile(open("installer/management/dns-appliance-status-monitor/server.py", encoding="utf-8").read(), "server.py", "exec")'
          python3 -c 'compile(open("agent/server.py", encoding="utf-8").read(), "server.py", "exec")'
      - name: Check Ruby syntax
        run: |
          ruby -c world/bin/resolve-world
          ruby -c world/tests/world-contract-simulation.rb
      - name: Validate World contract
        run: world/tests/world-contract-simulation.rb
      - name: Validate Catalog contracts
        run: |
          catalog/bin/verify-catalog
          catalog/tests/catalog-contract.sh
      - name: Resolve embedded Catalog
        working-directory: installer
        run: usb-media/resolve-catalog
      - name: Run Installer simulations
        working-directory: installer
        run: |
          tests/install-gate-simulation.sh
          tests/management-simulation.sh
          tests/tailscale-enrollment-simulation.sh
          tests/media-catalog-simulation.sh
          tests/macos-writer-simulation.sh
          tests/inventory-wizard-simulation.sh
          tests/repository-contract.sh
      - name: Run Agent Gateway simulation
        run: /tmp/device-os-agent-ci/bin/python agent/tests/gateway_simulation.py
