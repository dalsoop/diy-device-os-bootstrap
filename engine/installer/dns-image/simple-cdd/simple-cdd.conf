profiles="dns"
auto_profiles="dns"
build_profiles="dns-build"

debian_mirror="https://snapshot.debian.org/archive/debian/20261011T000000Z/"
security_mirror="https://snapshot.debian.org/archive/debian-security/20261011T000000Z/"
updates_mirror="https://snapshot.debian.org/archive/debian/20261011T000000Z/"
mirror_components="main non-free-firmware"
# Simple-CDD 0.6.9 otherwise fetches the removed trixie i386 installer.
# build-image supplies a signed-Release/checksum-verified amd64-only tree.
custom_installer="${DNS_APPLIANCE_DI_DIR:?build-image must supply the verified Debian installer}"
export DISABLE_UEFI_32="1"

export ARCH="amd64"
export CODENAME="trixie"
export DEBVERSION="13.7"
# Keep the offline package closure and application payload on one image.
export DISKTYPE="DVD"
export MAXCDS="1"
export INSTALLER_CD="2"
export DOJIGDO="0"
export DISKINFO="DIY Device OS Installer - DNS Appliance - Debian 13 amd64"
export KERNEL_PARAMS="auto=true priority=critical preseed/file=/cdrom/simple-cdd/default.preseed"

# Preserve Debian menus defaults (wait indefinitely). Simple-CDD translates a
# numeric zero into GRUB timeout=0, which boots immediately rather than waiting.
BOOT_TIMEOUT=""
use_serial_console="false"
